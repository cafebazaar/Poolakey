apply plugin: 'com.android.library'
apply plugin: 'kotlin-android'
apply plugin: 'kotlin-android-extensions'
apply plugin: 'org.jetbrains.dokka'

ext {
    package_id = 'Poolakey'
    artifact_id = 'poolakey'
}

android {
    compileSdkVersion buildVersions.compileSdkVersion
    buildToolsVersion buildVersions.buildToolsVersion
    defaultConfig {
        minSdkVersion buildVersions.minSdkVersion
        targetSdkVersion buildVersions.targetSdkVersion
        versionCode 1
        versionName poolakeyVersion
        consumerProguardFiles 'consumer-rules.pro'
    }

    Properties properties = new Properties()
    properties.load(rootProject.file('bazaar.properties').newDataInputStream())

    buildTypes.each {
        it.buildConfigField 'String', 'BAZAAR_HASH', "\"${properties.getProperty('bazaarReleaseHash')}\""
        // Signing key of the TV-only build (com.farsitel.bazaar.tv). Leave empty when it shares the phone key.
        it.buildConfigField 'String', 'BAZAAR_TV_HASH', "\"${properties.getProperty('bazaarTvReleaseHash', '')}\""
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    kotlinOptions {
        jvmTarget = "1.8"
    }
}

dependencies {

    implementation fileTree(dir: 'libs', include: ['*.jar'])

    implementation "org.jetbrains.kotlin:kotlin-stdlib-jdk7:$libraryVersions.kotlin"

    api "androidx.fragment:fragment:$libraryVersions.fragment"

}

apply from: "$rootDir/publish/maven-publish.gradle"

tasks.named("dokkaHtml") {
    outputDirectory.set(file("$buildDir/kotlindoc"))
    dokkaSourceSets.configureEach {
        skipEmptyPackages.set(true)
    }
}
